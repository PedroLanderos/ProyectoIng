name: Run .NET 8 Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore Proyecto.ArticlesApi.Solution/UnitTest.ArticlesApi/UnitTest.ArticlesApi.csproj
        dotnet restore Proyecto.AuthenticationApi.Solution/UnitTest.AuthenticationApi/UnitTest.AuthenticationApi.csproj
        dotnet restore Proyecto.SuggestApi.Solution/UnitTest.SuggestApi/UnitTest.SuggestApi.csproj

    - name: Build test projects
      run: |
        dotnet build Proyecto.ArticlesApi.Solution/UnitTest.ArticlesApi/UnitTest.ArticlesApi.csproj --no-restore
        dotnet build Proyecto.AuthenticationApi.Solution/UnitTest.AuthenticationApi/UnitTest.AuthenticationApi.csproj --no-restore
        dotnet build Proyecto.SuggestApi.Solution/UnitTest.SuggestApi/UnitTest.SuggestApi.csproj --no-restore

    - name: Run unit tests - ArticlesApi
      run: dotnet test Proyecto.ArticlesApi.Solution/UnitTest.ArticlesApi/UnitTest.ArticlesApi.csproj --no-build --verbosity normal

    - name: Run unit tests - AuthenticationApi
      run: dotnet test Proyecto.AuthenticationApi.Solution/UnitTest.AuthenticationApi/UnitTest.AuthenticationApi.csproj --no-build --verbosity normal

    - name: Run unit tests - SuggestApi
      run: dotnet test Proyecto.SuggestApi.Solution/UnitTest.SuggestApi/UnitTest.SuggestApi.csproj --no-build --verbosity normal
