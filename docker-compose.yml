version: "3.8"
services:
  authenticationapiservice:
    build:
      context: .
      dockerfile: Proyecto.AuthenticationApi.Solution/AuthenticationApi.Presentation/Dockerfile
    ports:
      - "5000:5000" # Mapea el puerto 5000 del host al puerto 80 del contenedor
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    networks:
      - my_network
    restart: on-failure
    
  suggestionapiservice:
    build:
      context: .
      dockerfile: Proyecto.SuggestApi.Solution/SuggestApi.Presentation/Dockerfile
    ports:
      - "5001:5001" # Mapea el puerto 5000 del host al puerto 80 del contenedor
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5001
    networks:
      - my_network
    restart: on-failure
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Lancort20+12"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql 
    networks:
      - my_network
  
  frontend:
    container_name: dockerwdb-frontend
    build:
      context: ./front/proyectoFront
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - authenticationapiservice  
    networks:
      - my_network
    restart: always

networks:
  my_network:
    driver: bridge

volumes:
  sqlvolume: