version: "3.8"
services:
  authenticationapiservice:
    build:
      context: .
      dockerfile: Proyecto.AuthenticationApi.Solution/AuthenticationApi.Presentation/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    networks:
      - my_network
    restart: on-failure
    
  articlesapiservice:
    build:
      context: .
      dockerfile: Proyecto.ArticlesApi.Solution/ArticlesApi.Presentation/Dockerfile
    ports:
      - "5002:5002"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5002
    networks:
      - my_network
    restart: on-failure
  
  suggestionapiservice:
    build:
      context: .
      dockerfile: Proyecto.SuggestApi.Solution/SuggestApi.Presentation/Dockerfile
    ports:
      - "5001:5001"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5001
    networks:
      - my_network
    restart: on-failure
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Lancort20+12"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql 
    networks:
      - my_network

  apigateway:
    build:
      context: .
      dockerfile: Proyecto.ApiGateway.Solution/ApiGateway.Presentation/Dockerfile
    ports:
      -5003:5003
    depends_on:
      - authenticationapiservice
      - articlesapiservice
      - suggestionapiservice
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5003
    networks:
      - my_network
    restart: on-failure
  
  frontend:
    container_name: dockerwdb-frontend
    build:
      context: ./front/proyectoFront
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - authenticationapiservice
      - suggestionapiservice
      - articlesapiservice  
      - apigateway
    networks:
      - my_network
    restart: always

networks:
  my_network:
    driver: bridge

volumes:
  sqlvolume: